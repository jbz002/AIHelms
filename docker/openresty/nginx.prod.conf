# openresty 网关生产配置（host 网络模式）
# 独占 LITELLM_PORT(30710) 对外入口，反代内部 litellm(127.0.0.1:30711)，
# 按请求端点 + 模型方言改写 body.model，让用户面只填裸名。
#
# 与 nginx.conf（dev bridge）的差异：
#   listen 80→30710、upstream litellm:4000→127.0.0.1:30711、
#   去 resolver 127.0.0.11（host 模式失效，upstream 静态 IP 不走 resolver）、
#   worker_processes auto→1（单 worker 免 N 份并行 fetch map）。
# BACKEND_HOST 必须用 IP（host 模式无 resolver、/etc/hosts 无容器名）。

env BACKEND_HOST;
env RECTIFY_ENABLED;
env BACKEND_PORT;
error_log /dev/stderr notice;

worker_processes 1;
events { worker_connections 1024; }

http {
    lua_package_path "/etc/openresty/?.lua;;";

    # Claude Code 等客户端 body 可达数百 KB~MB 级(系统提示+工具+历史+图片)，
    # 超过 client_body_buffer_size(默认 16k)会落盘临时文件，ngx.req.get_body_data()
    # 返回 nil，model_rewrite 改写静默失效、大请求走错方言组
    client_body_buffer_size 10m;
    client_max_body_size 20m;

    upstream litellm_upstream {
        server 127.0.0.1:30711;
        keepalive 32;
    }

    # worker 启动时拉取模型方言映射并定时刷新（cosocket，timer 内可用）
    init_worker_by_lua_block {
        local m = require("model_rewrite")
        m.start_timer()
    }

    server {
        listen 30710;

        # GET /v1/models 与 /models（LiteLLM 别名）:过滤响应里 (Anthropic) 方言分身条目
        location = /v1/models {
            header_filter_by_lua_block {
                local m = require("model_rewrite")
                m.strip_content_length()
            }
            body_filter_by_lua_block {
                local m = require("model_rewrite")
                m.filter_models_body()
            }

            proxy_pass http://litellm_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 强制上游返回未压缩体,lua 才能解析 JSON
            proxy_set_header Accept-Encoding "identity";
        }

        location = /models {
            header_filter_by_lua_block {
                local m = require("model_rewrite")
                m.strip_content_length()
            }
            body_filter_by_lua_block {
                local m = require("model_rewrite")
                m.filter_models_body()
            }

            proxy_pass http://litellm_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 强制上游返回未压缩体,lua 才能解析 JSON
            proxy_set_header Accept-Encoding "identity";
        }

        # 聊天三端点：模型改写 + 错误提示；400/422 时自动整流历史状态并重试一次
        location ~ ^/v1/(messages|messages/count_tokens|chat/completions|responses|responses/compact)$ {
            rewrite_by_lua_block {
                local m = require("model_rewrite")
                m.rewrite()
            }

            # 切换模型/供应商后的历史兼容错误：命中 thinking 签名 / 密文类报错时追加可操作提示
            header_filter_by_lua_block {
                local m = require("model_rewrite")
                m.prepare_error_hint()
            }
            body_filter_by_lua_block {
                local m = require("model_rewrite")
                m.annotate_switch_error()
            }

            # 整流重试：上游返回 400/422 时先剥掉别家签发的历史状态再试一次
            proxy_intercept_errors on;
            error_page 400 422 = @rectify_retry;

            proxy_pass http://litellm_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式透传
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            # 改写 body.model（/v1/chat/completions + /v1/messages + /v1/responses 之外的端点原样转发）
            rewrite_by_lua_block {
                local m = require("model_rewrite")
                m.rewrite()
            }

            # 切换模型/供应商后的历史兼容错误：命中 thinking 签名 / 密文类报错时追加可操作提示
            header_filter_by_lua_block {
                local m = require("model_rewrite")
                m.prepare_error_hint()
            }
            body_filter_by_lua_block {
                local m = require("model_rewrite")
                m.annotate_switch_error()
            }

            proxy_pass http://litellm_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式透传
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # error_page 内部跳转目标：只重试一次（本 location 不声明 error_page，不会循环）
        location @rectify_retry {
            rewrite_by_lua_block {
                local m = require("model_rewrite")
                m.retry_with_rectified_body()
            }

            header_filter_by_lua_block {
                local m = require("model_rewrite")
                m.prepare_error_hint()
            }
            body_filter_by_lua_block {
                local m = require("model_rewrite")
                m.annotate_switch_error()
            }

            proxy_pass http://litellm_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式透传
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}