# openresty 网关：独占 LITELLM_PORT，反代 litellm，按请求端点 + 模型方言改写 body.model
# 让用户面只填裸名，openresty 自动路由到正确 (Anthropic) 后缀组

env BACKEND_HOST;
error_log /dev/stderr notice;

worker_processes auto;
events { worker_connections 1024; }

http {
    lua_package_path "/etc/openresty/?.lua;;";
    resolver 127.0.0.11 valid=30s;

    upstream litellm_upstream {
        server litellm:4000;
        keepalive 32;
    }

    # worker 启动时拉取模型方言映射并定时刷新（cosocket，timer 内可用）
    init_worker_by_lua_block {
        local m = require("model_rewrite")
        m.start_timer()
    }

    server {
        listen 80;

        # GET /v1/models:过滤响应里 (Anthropic) 方言分身条目
        location = /v1/models {
            header_filter_by_lua_block {
                local m = require("model_rewrite")
                m.strip_content_length()
            }
            body_filter_by_lua_block {
                local m = require("model_rewrite")
                m.filter_models_body()
            }

            proxy_pass http://litellm_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 强制上游返回未压缩体,lua 才能解析 JSON
            proxy_set_header Accept-Encoding "identity";
        }

        location / {
            # 改写 body.model（仅 /v1/chat/completions + /v1/messages）
            rewrite_by_lua_block {
                local m = require("model_rewrite")
                m.rewrite()
            }

            proxy_pass http://litellm_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式透传
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
