general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  enable_mcp_server: true
  store_model_in_db: true
  store_prompts_in_spend_logs: true

litellm_settings:
  drop_params: true
  set_verbose: false
  # v1.93 起对 openai provider 的 /v1/messages 默认走 Responses API 桥接；
  # 聚合网关（如 commandcode.ai）无 /responses 路由，404。
  # 退回 chat/completions 翻译，恢复「openai-only 上游自动支持 anthropic 双格式」。
  # anthropic 方言凭证（真 anthropic 端点）不受影响，仍原生直传。
  use_chat_completions_url_for_anthropic_messages: true

# 模型配置通过管理界面添加，无需在此文件中配置
# 添加后会持久化到数据库中
model_list: []
