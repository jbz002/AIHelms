general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  enable_mcp_server: true
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  # MCP 授权撤销的传播上限（秒）。/key/update 不会失效 user_api_key_cache
  # （只有 /key/delete 会），默认 TTL 60s 意味着「收回某人的 MCP 授权」最长
  # 60 秒才生效（PoC-0 实测：默认 ≈60s，设 5 后实测 5.5s）。
  user_api_key_cache_ttl: 5

litellm_settings:
  drop_params: true
  set_verbose: false
  # v1.93 起对 openai provider 的 /v1/messages 默认走 Responses API 桥接；
  # 聚合网关（如 commandcode.ai）无 /responses 路由，404。
  # 退回 chat/completions 翻译，恢复「openai-only 上游自动支持 anthropic 双格式」。
  # anthropic 方言凭证（真 anthropic 端点）不受影响，仍原生直传。
  use_chat_completions_url_for_anthropic_messages: true

# 模型配置通过管理界面添加，无需在此文件中配置
# 添加后会持久化到数据库中
model_list: []
