# AIHelms 正式服部署（host 网络模式，复用平台 pg/redis）
# 服务器: 131.131.2.10（daemon.json iptables=false → 必须 host）
# 复用中间件: pg 127.0.0.1:35432 / redis 127.0.0.1:36379（由 xzs-ai-infra 管理）
# 端口: nginx 30700 / litellm 30710 / aihelms 30720 / skillspector 8010(内部)
#
# 用法:
#   cd /home/ai/aihelms/AIHelms
#   docker compose -p aihelms -f docker-compose.prod.yml up -d
#
# 说明:
#   - aihelms 本地 build（含本地二开，不用 0.1.19 预构建镜像）
#   - litellm 需先按指南 retag：ghcr.nju.edu.cn/berriai/litellm:v1.93.0 → ghcr.io/berriai/litellm:v1.93.0
#   - skillspector 用 8010（对齐 aihelms 默认 AI_POLICIES_SCANNER_URL，内部不对外）
#   - docling-serve / docs-mcp-server 见各自 compose，独立部署

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0
    container_name: aihelms-litellm
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD}@127.0.0.1:35432/${POSTGRES_DB}?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: "True"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./docker/litellm/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "30710"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  skillspector:
    image: registry.cn-zhangjiakou.aliyuncs.com/microbaton/skillspector:${SKILLSPECTOR_VERSION:-0.1.0}
    container_name: aihelms-skillspector
    restart: unless-stopped
    network_mode: host
    environment:
      SKILLSPECTOR_SERVICE_INPUT_ROOT: /scan-input
      SKILLSPECTOR_SERVICE_TIMEOUT_SECONDS: ${AI_POLICIES_TIMEOUT_SECONDS:-600}
      SKILLSPECTOR_LOG_LEVEL: ${SKILLSPECTOR_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/skills:/scan-input/skills:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  aihelms:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: aihelms:prod
    container_name: aihelms-app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${DB_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:${REDIS_PORT}/0
      LITELLM_URL: http://127.0.0.1:${LITELLM_PORT}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      AIHELMS_PORT: ${AIHELMS_PORT:-30720}
      AI_POLICIES_SCANNER_URL: http://127.0.0.1:8010
      DOCLING_SERVE_URL: http://127.0.0.1:${DOCLING_SERVE_PORT:-30740}
      DOCS_MCP_SERVER_URL: http://127.0.0.1:${DOCS_MCP_SERVER_PORT:-30750}
      DOCS_MCP_SERVER_WEB_URL: http://127.0.0.1:${DOCS_MCP_WEB_PORT:-30752}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      WEB_PORT: ${WEB_PORT:-30700}
      LITELLM_PORT: ${LITELLM_PORT:-30710}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_DIR: /logs
      DATA_DIR: /app/data
    volumes:
      - ./logs:/logs
      - ./data:/app/data
      - frontend_dist:/frontend
    depends_on:
      - litellm
      - skillspector
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:latest
    container_name: aihelms-nginx
    restart: unless-stopped
    network_mode: host
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-300s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-300s}
    volumes:
      - ./docker/nginx/default.conf.prod.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
      - frontend_dist:/usr/share/nginx/html:ro
    entrypoint:
      ["sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"]
    depends_on:
      - aihelms

volumes:
  frontend_dist:
