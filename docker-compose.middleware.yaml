services:
  # docs-mcp-server — 文档爬取 worker
  docs-mcp-worker:
    image: ghcr.io/arabold/docs-mcp-server:latest
    restart: unless-stopped
    container_name: docs-mcp-worker
    command: ["worker", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${DOCS_MCP_WORKER_PORT:-8080}:8080"
    env_file:
      - ../demo/docs-mcp-server/.env
    volumes:
      - docs-mcp-data:/data
      - docs-mcp-config:/config
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"net\").connect(8080, \"127.0.0.1\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # docs-mcp-server — MCP 协议端点（供 AI 工具调用）
  docs-mcp-server:
    image: ghcr.io/arabold/docs-mcp-server:latest
    restart: unless-stopped
    container_name: docs-mcp-server
    command: ["mcp", "--protocol", "http", "--host", "0.0.0.0", "--port", "6280", "--server-url", "http://docs-mcp-worker:8080/api", "--no-logo"]
    ports:
      - "${DOCS_MCP_SERVER_PORT:-6280}:6280"
    env_file:
      - ../demo/docs-mcp-server/.env
    volumes:
      - docs-mcp-config:/config
    depends_on:
      docs-mcp-worker:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # docs-mcp-server — Web 管理界面 + SSE 事件流
  docs-mcp-web:
    image: ghcr.io/arabold/docs-mcp-server:latest
    restart: unless-stopped
    container_name: docs-mcp-web
    command: ["web", "--host", "0.0.0.0", "--port", "6281", "--server-url", "http://docs-mcp-worker:8080/api", "--no-logo"]
    ports:
      - "${DOCS_MCP_WEB_PORT:-6281}:6281"
    env_file:
      - ../demo/docs-mcp-server/.env
    volumes:
      - docs-mcp-config:/config
    depends_on:
      docs-mcp-worker:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aihelms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihelms}
      POSTGRES_DB: ${POSTGRES_DB:-aihelms}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["postgres", "-c", "timezone=${TZ:-Asia/Shanghai}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihelms}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aihelms}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aihelms}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.85.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aihelms}:${POSTGRES_PASSWORD:-aihelms}@db:5432/${POSTGRES_DB:-aihelms}?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-change-me}
      STORE_MODEL_IN_DB: "True"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./docker/litellm/litellm.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT}:4000"
    command: ["--config", "/app/config.yaml"]
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  skillspector:
    image: registry.cn-zhangjiakou.aliyuncs.com/microbaton/skillspector:${SKILLSPECTOR_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      SKILLSPECTOR_SERVICE_INPUT_ROOT: /scan-input
      SKILLSPECTOR_SERVICE_TIMEOUT_SECONDS: ${AI_POLICIES_TIMEOUT_SECONDS:-600}
      SKILLSPECTOR_LOG_LEVEL: ${SKILLSPECTOR_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/skills:/scan-input/skills:ro
    ports:
      - "${SKILLSPECTOR_PORT:-8010}:8010"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-300s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-300s}
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./docker/nginx/dev.default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  redisdata:
  docs-mcp-data:
    external: true
  docs-mcp-config:
    external: true
