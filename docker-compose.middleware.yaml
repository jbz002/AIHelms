services:
  # docs-mcp-server — 文档爬取 worker
  # docling-serve（文档格式转换：PDF/DOCX/PPTX 等 → Markdown）
  docling-serve:
    build:
      context: ../docling-serve
      dockerfile: Dockerfile.local
    image: docling-serve:local
    restart: unless-stopped
    container_name: docling-serve
    ports:
      - "${DOCLING_SERVE_PORT:-5001}:5001"
    environment:
      DOCLING_CONVERT_TIMEOUT: ${DOCLING_CONVERT_TIMEOUT:-60}
      HF_HUB_DISABLE_XET_DOWNLOAD: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # NOTE: docs-mcp-worker / docs-mcp-server / docs-mcp-web 已从本文件移除
  # 这些服务由 docs-mcp-server 项目自行管理（docker-compose.yml + docker-compose.wsl.yml）
  # 仅保留 volumes 引用，确保 data/config 持久化

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aihelms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihelms}
      POSTGRES_DB: ${POSTGRES_DB:-aihelms}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["postgres", "-c", "timezone=${TZ:-Asia/Shanghai}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihelms}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aihelms}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aihelms}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aihelms}:${POSTGRES_PASSWORD:-aihelms}@db:5432/${POSTGRES_DB:-aihelms}?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-change-me}
      STORE_MODEL_IN_DB: "True"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./docker/litellm/litellm.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    command: ["--config", "/app/config.yaml"]
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  openresty:
    image: openresty/openresty:alpine
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${AIHELMS_BACKEND_HOST:-host.docker.internal}
    volumes:
      - ./docker/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./docker/openresty/model_rewrite.lua:/etc/openresty/model_rewrite.lua:ro
    ports:
      - "${LITELLM_PORT:-4000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - litellm
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  skillspector:
    image: registry.cn-zhangjiakou.aliyuncs.com/microbaton/skillspector:${SKILLSPECTOR_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      SKILLSPECTOR_SERVICE_INPUT_ROOT: /scan-input
      SKILLSPECTOR_SERVICE_TIMEOUT_SECONDS: ${AI_POLICIES_TIMEOUT_SECONDS:-600}
      SKILLSPECTOR_LOG_LEVEL: ${SKILLSPECTOR_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/skills:/scan-input/skills:ro
    ports:
      - "${SKILLSPECTOR_PORT:-8010}:8010"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-300s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-300s}
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./docker/nginx/dev.default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  redisdata:
  docs-mcp-data:
    external: true
  docs-mcp-config:
    external: true
